<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light">
<meta name="description" content="A wall of random GIFs pulled from six corners of the internet.">
<meta property="og:title" content="The Great GIFs Museum">
<meta property="og:description" content="A wall of random GIFs pulled from six corners of the internet.">
<meta property="og:type" content="website">
<title>The Great GIFs Museum</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='7' y='7' width='18' height='18' rx='6' fill='%23e10600'/%3E%3C/svg%3E">
<style>
  :root{
    --paper:#ffffff;
    --hair:rgba(0,0,0,.10);
    --hair-soft:rgba(0,0,0,.05);
    --red:#e10600;
    --red-soft:rgba(225,6,0,.16);
    --rail:14px;
    --cols:5;
    --gap:clamp(10px,1.4vw,20px);
    --radius:clamp(12px,1.4vw,20px);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  html,body{margin:0;padding:0;background:var(--paper)}
  body{-webkit-font-smoothing:antialiased;overflow-x:hidden;padding-left:var(--rail)}
  body.zoom{overflow:hidden}

  .rail{position:fixed;top:0;left:0;bottom:0;width:var(--rail);
    border-right:1px solid var(--hair-soft);background:var(--paper);z-index:20;pointer-events:none}
  .rail::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;
    transform:translateX(-50%);background:var(--hair-soft)}
  .rail i{position:absolute;left:50%;top:0;width:3px;height:0;transform:translateX(-50%);
    background:var(--red);transition:height .12s linear}

  .wall{width:100%;max-width:1480px;margin:0 auto;
    padding:clamp(3rem,9vh,7rem) clamp(1rem,3vw,3rem) 0;
    display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:var(--gap)}

  .tile{position:relative;aspect-ratio:1/1;border-radius:var(--radius);
    border:1px solid var(--hair);background:var(--paper);overflow:hidden;padding:0;
    cursor:zoom-in;-webkit-tap-highlight-color:transparent;
    opacity:0;animation:fade .45s ease forwards;transition:box-shadow .2s ease}
  @keyframes fade{to{opacity:1}}

  .tile img{width:100%;height:100%;object-fit:cover;display:block;
    transition:transform .35s cubic-bezier(.4,0,.2,1);
    background:
      linear-gradient(90deg,var(--hair-soft) 1px,transparent 1px) 0 0/14px 14px,
      linear-gradient(var(--hair-soft) 1px,transparent 1px) 0 0/14px 14px}
  .tile img.small{object-fit:contain;image-rendering:pixelated;padding:8%}
  .tile:hover{box-shadow:0 0 0 2px var(--red)}
  .tile:hover img{transform:scale(1.05)}
  .tile:hover img.small{transform:scale(1.1)}
  .tile:focus-visible{outline:none;box-shadow:0 0 0 3px var(--red)}

  .loader{grid-column:1/-1;height:clamp(4rem,10vh,8rem);
    display:flex;align-items:center;justify-content:center;gap:10px}
  .loader b{width:6px;height:6px;border-radius:50%;background:var(--red);
    animation:blip 1s ease-in-out infinite}
  .loader b:nth-child(2){animation-delay:.15s}
  .loader b:nth-child(3){animation-delay:.3s}
  @keyframes blip{0%,100%{opacity:.18;transform:scale(.7)}50%{opacity:1;transform:scale(1)}}
  .loader.dead b{animation:none;background:transparent;border:1px solid var(--red);
    width:10px;height:10px;opacity:1}

  .act{position:fixed;right:clamp(16px,3vw,34px);bottom:clamp(16px,3vw,34px);
    width:58px;height:58px;border-radius:18px;border:none;padding:0;cursor:pointer;
    background:var(--red);display:grid;place-items:center;
    box-shadow:0 0 0 0 var(--red-soft);transition:box-shadow .3s ease,transform .3s ease;
    -webkit-tap-highlight-color:transparent}
  .act:hover{box-shadow:0 0 0 10px var(--red-soft)}
  .act:active{transform:scale(.94)}
  .act:focus-visible{outline:2px solid var(--red);outline-offset:4px}
  .act svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:2;
    stroke-linecap:round;stroke-linejoin:round}

  .reset{z-index:30}
  .reset svg{transition:transform .6s cubic-bezier(.4,0,.2,1)}
  .reset.spin svg{transform:rotate(-360deg)}
  body.zoom .reset{display:none}

  .dl{z-index:50;display:none}
  body.zoom .dl{display:grid}
  .dl.done{background:#fff;box-shadow:0 0 0 2px var(--red)}
  .dl.done svg{stroke:var(--red)}

  .lb{position:fixed;inset:0;z-index:40;background:rgba(255,255,255,.97);
    display:none;place-items:center;padding:clamp(16px,5vw,64px);cursor:zoom-out}
  .lb.on{display:grid}
  .lb img{max-width:100%;max-height:100%;display:block;border-radius:var(--radius)}
  .lb::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--red)}

  ::selection{background:var(--red);color:#fff}
  ::-webkit-scrollbar{width:0}

  @media (max-width:820px){:root{--cols:4}}
  @media (max-width:600px){:root{--cols:3;--rail:8px}}
  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    .tile{animation:none;opacity:1}
    .tile img,.act svg{transition:none}
    .loader b{animation:none;opacity:.6}
  }
</style>
</head>
<body>

<div class="rail"><i id="fill"></i></div>

<main class="wall" id="wall">
  <div class="loader" id="loader"><b></b><b></b><b></b></div>
</main>

<button class="act reset" id="reset" aria-label="Neu laden">
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path d="M20 12a8 8 0 1 1-2.6-5.9"/>
    <path d="M20 4v4.6h-4.6"/>
  </svg>
</button>

<button class="act dl" id="dl" aria-label="GIF herunterladen">
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path d="M12 3v11"/><path d="M7.5 10L12 14.5 16.5 10"/><path d="M4.5 20h15"/>
  </svg>
</button>

<div class="lb" id="lb" aria-hidden="true"><img alt=""></div>

<script>
/* The Great GIFs Museum — keine API-Keys, keine Abhängigkeiten, ein File. */
(() => {
  'use strict';

  const wall   = document.getElementById('wall');
  const loader = document.getElementById('loader');
  const fill   = document.getElementById('fill');
  const lb     = document.getElementById('lb');
  const lbImg  = lb.querySelector('img');
  const dlBtn  = document.getElementById('dl');

  const BATCH    = 20;      // GIFs pro Nachladung (4 Reihen à 5)
  const COOLDOWN = 60000;   // ms bis eine tote Quelle neu probiert wird

  const log   = (...a) => console.log('%c[museum]', 'color:#e10600', ...a);
  const rnd   = a => a[Math.floor(Math.random() * a.length)];
  const mix   = a => a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(v => v[1]);
  const int   = n => Math.floor(Math.random() * n);
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  const WORDS = ['cat','dance','fire','wave','loop','star','rain','robot','pixel','coffee',
                 'dog','space','neon','glitch','flower','train','moon','ocean','ghost','party',
                 'clock','engine','bird','skull','rainbow','snow','butterfly','dragon'];

  let seen = new Set();
  let busy = false;
  let lastTry = 0;

  /* ------------------------------------------------------------------
     Transport: fetch, bei CORS-Blockade JSONP (nötig für Reddit & Co.)
  ------------------------------------------------------------------ */

  function jsonp(url, param) {
    return new Promise((resolve, reject) => {
      const id = 'cb' + Math.random().toString(36).slice(2, 10);
      const s = document.createElement('script');
      const timer = setTimeout(() => { done(); reject(new Error('timeout')); }, 12000);

      function done() {
        clearTimeout(timer);
        try { delete window[id]; } catch (e) { window[id] = undefined; }
        s.remove();
      }
      window[id] = d => { done(); resolve(d); };
      s.onerror = () => { done(); reject(new Error('blocked')); };
      s.referrerPolicy = 'no-referrer';
      s.src = url + (url.indexOf('?') > -1 ? '&' : '?') + param + '=' + id;
      document.head.appendChild(s);
    });
  }

  async function getJSON(url, jsonpParam) {
    try {
      const r = await fetch(url, { referrerPolicy: 'no-referrer' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return await r.json();
    } catch (err) {
      if (!jsonpParam) throw err;
      return jsonp(url, jsonpParam);
    }
  }

  /* zieht jede .gif-URL aus beliebig verschachteltem JSON */
  function harvest(obj, out) {
    out = out || [];
    if (typeof obj === 'string') {
      if (/^https?:\/\/\S+\.gif(\?|$)/i.test(obj)) out.push({ src: obj });
    } else if (obj && typeof obj === 'object') {
      for (const k in obj) harvest(obj[k], out);
    }
    return out;
  }

  /* ------------------------------------------------------------------
     Quellen
  ------------------------------------------------------------------ */

  const SUBS = ['perfectloops','aww_gifs','reactiongifs','Cinemagraphs','educationalgifs',
                'chemicalreactiongifs','physicsgifs','mechanical_gifs','analogygifs','gifs',
                'woahdude','BetterEveryLoop','oddlysatisfying','blackmagicfuckery',
                'gifrecipes','HighQualityGifs'];

  async function loadReddit() {
    const sort = rnd(['hot','new','top','rising','top']);
    let url = 'https://www.reddit.com/r/' + mix(SUBS).slice(0, 5).join('+')
            + '/' + sort + '.json?limit=100&raw_json=1';
    if (sort === 'top') url += '&t=' + rnd(['all','year','month','week']);

    const d = await getJSON(url, 'jsonp');
    return ((d.data && d.data.children) || [])
      .map(k => k.data)
      .filter(p => p && !p.over_18)
      .map(p => {
        const link = p.url_overridden_by_dest || p.url || '';
        if (/\.gif(\?|$)/i.test(link)) return { src: link };
        if (/giphy\.com\/(gifs|media)\//i.test(link)) {
          const id = (link.match(/([A-Za-z0-9]{6,})(?:\/giphy\.gif)?$/) || [])[1];
          if (id) return { src: 'https://i.giphy.com/media/' + id + '/giphy.gif' };
        }
        const im = p.preview && p.preview.images && p.preview.images[0];
        const v = im && im.variants && im.variants.gif && im.variants.gif.source;
        return v && v.url ? { src: v.url } : null;
      })
      .filter(Boolean);
  }

  /* Auf Bluesky werden GIFs als externe Embeds gepostet — meist Tenor und Giphy. */
  async function loadBluesky() {
    const q = rnd(['media.tenor.com', 'giphy.com', 'media.tenor.com', rnd(WORDS) + ' gif']);
    const url = 'https://public.api.bsky.app/xrpc/app.bsky.feed.searchPosts'
              + '?limit=100&sort=latest&q=' + encodeURIComponent(q);
    const d = await getJSON(url);
    const out = [];
    ((d && d.posts) || []).forEach(p => {
      const flagged = (p.labels && p.labels.length) ||
                      (p.author && p.author.labels && p.author.labels.length);
      if (!flagged) harvest(p.embed, out);
    });
    return out;
  }

  const COMMONS = 'https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*'
                + '&prop=imageinfo&iiprop=url|mime|size';

  async function loadCommons() {
    const url = rnd([
      COMMONS + '&generator=search&gsrnamespace=6&gsrlimit=40&gsrsort=random'
              + '&gsrsearch=' + encodeURIComponent('filemime:image/gif'),
      COMMONS + '&generator=search&gsrnamespace=6&gsrlimit=40&gsroffset=' + int(4000)
              + '&gsrsearch=' + encodeURIComponent('filemime:image/gif'),
      COMMONS + '&generator=search&gsrnamespace=6&gsrlimit=40&gsroffset=' + int(200)
              + '&gsrsearch=' + encodeURIComponent('filemime:image/gif ' + rnd(WORDS)),
      COMMONS + '&generator=categorymembers&gcmtype=file&gcmlimit=40&gcmsort=timestamp'
              + '&gcmdir=' + rnd(['older','newer'])
              + '&gcmtitle=' + encodeURIComponent('Category:Animated GIF files')
    ]);
    const d = await getJSON(url, 'callback');
    const pages = (d.query && d.query.pages) || {};
    return Object.keys(pages)
      .map(k => pages[k].imageinfo && pages[k].imageinfo[0])
      .filter(i => i && i.mime === 'image/gif' && i.size > 0 && i.size < 5e6)
      .map(i => ({ src: i.url }));
  }

  async function loadArchive() {
    const q = 'format:(GIF) AND mediatype:image';
    const url = 'https://archive.org/advancedsearch.php?q=' + encodeURIComponent(q)
              + '&fl%5B%5D=identifier&rows=15&page=' + (1 + int(50)) + '&output=json';
    const d = await getJSON(url, 'callback');
    const docs = mix((d.response && d.response.docs) || []).slice(0, 4);
    const out = [];

    for (const doc of docs) {
      try {
        const meta = await getJSON(
          'https://archive.org/metadata/' + encodeURIComponent(doc.identifier), 'callback');
        ((meta && meta.files) || [])
          .filter(f => /\.gif$/i.test(f.name || '') && +f.size > 0 && +f.size < 4e6)
          .slice(0, 3)
          .forEach(f => out.push({
            src: 'https://archive.org/download/' + doc.identifier + '/'
               + f.name.split('/').map(encodeURIComponent).join('/')
          }));
      } catch (e) { /* nächstes Item */ }
    }
    return out;
  }

  /* GeoCities-GIFs aus dem Internet Archive */
  async function loadGifCities() {
    const q = encodeURIComponent(rnd(WORDS));
    const endpoints = [
      'https://gifcities.org/api/v1/gifs?q=' + q,
      'https://gifcities.org/api/v1/search?q=' + q,
      'https://gifcities.org/search?q=' + q + '&format=json'
    ];

    for (const url of endpoints) {
      try {
        const d = await getJSON(url);
        const direct = harvest(d);
        if (direct.length) return direct;

        const list = Array.isArray(d) ? d : (d.items || d.results || d.gifs || []);
        const out = list.map(it => {
          const p = typeof it === 'string' ? it : (it.gif || it.url || it.path || '');
          if (!p) return null;
          return /^https?:/i.test(p)
            ? { src: p }
            : { src: 'https://web.archive.org/web/' + p.replace(/^\/+/, '') };
        }).filter(Boolean);
        if (out.length) return out;
      } catch (e) { /* nächster Endpoint */ }
    }
    return [];
  }

  async function loadOpenverse() {
    const url = 'https://api.openverse.org/v1/images/?extension=gif&page_size=20'
              + '&page=' + (1 + int(15)) + '&q=' + encodeURIComponent(rnd(WORDS));
    const d = await getJSON(url);
    return ((d && d.results) || []).map(r => r.url ? { src: r.url } : null).filter(Boolean);
  }

  /* ------------------------------------------------------------------
     Pools — jede Quelle sammelt für sich, ausgeteilt wird reihum
  ------------------------------------------------------------------ */

  const SOURCES = [
    { id: 'reddit',    load: loadReddit },
    { id: 'bluesky',   load: loadBluesky },
    { id: 'commons',   load: loadCommons },
    { id: 'archive',   load: loadArchive },
    { id: 'gifcities', load: loadGifCities },
    { id: 'openverse', load: loadOpenverse }
  ].map(s => Object.assign(s, { pool: [], busy: false, dead: 0, deadAt: 0 }));

  const stock = () => SOURCES.reduce((n, s) => n + s.pool.length, 0);

  function pump(s) {
    if (s.dead > 3) {
      if (Date.now() - s.deadAt < COOLDOWN) return null;
      s.dead = 2;
    }
    if (s.busy || s.pool.length > 40) return null;

    s.busy = true;
    return s.load()
      .then(list => {
        const fresh = mix(list || []).filter(g => g.src && !seen.has(g.src));
        fresh.forEach(g => { seen.add(g.src); g.from = s.id; });
        s.pool.push(...fresh);
        s.dead = fresh.length ? 0 : s.dead + 1;
        log(s.id, '+' + fresh.length);
      })
      .catch(e => { s.dead++; log(s.id, 'down:', e.message); })
      .then(() => { s.busy = false; s.deadAt = Date.now(); });
  }

  async function ensure(min) {
    if (stock() >= min) { SOURCES.forEach(pump); return; }
    const jobs = SOURCES.map(pump).filter(Boolean);
    if (jobs.length) await Promise.race([Promise.all(jobs), sleep(5000)]);
  }

  /* reihum durch die Quellen — zwei Nachbarkacheln kommen nie von derselben */
  function deal(n) {
    const out = [];
    let order = mix(SOURCES.filter(s => s.pool.length));
    while (out.length < n && order.length) {
      for (const s of order) {
        if (s.pool.length && out.length < n) out.push(s.pool.shift());
      }
      order = order.filter(s => s.pool.length);
    }
    return out;
  }

  /* ------------------------------------------------------------------
     Wand
  ------------------------------------------------------------------ */

  function hang(gif) {
    const tile = document.createElement('button');
    const img  = document.createElement('img');

    tile.className = 'tile';
    tile.type = 'button';
    tile.setAttribute('aria-label', 'GIF');
    tile.dataset.from = gif.from || '';

    img.loading = 'lazy';
    img.decoding = 'async';
    img.referrerPolicy = 'no-referrer';
    img.alt = '';
    img.onerror = () => tile.remove();
    img.onload = () => { if (img.naturalWidth && img.naturalWidth < 180) img.classList.add('small'); };
    img.src = gif.src;

    tile.addEventListener('click', () => openLb(img.currentSrc || img.src));
    tile.appendChild(img);
    wall.insertBefore(tile, loader);
  }

  async function more() {
    if (busy) return;
    busy = true;
    lastTry = Date.now();
    loader.classList.remove('dead');

    if (stock() < BATCH) await ensure(BATCH);
    const batch = deal(BATCH);
    batch.forEach(hang);
    log('gelegt', batch.length, '| lager', stock());

    if (!batch.length && !wall.querySelector('.tile')) loader.classList.add('dead');
    busy = false;

    requestAnimationFrame(() => {
      if (document.body.scrollHeight <= innerHeight + 300 && batch.length) more();
    });
  }

  /* ------------------------------------------------------------------
     Grossansicht + Download
  ------------------------------------------------------------------ */

  let current = '';

  function openLb(src) {
    current = src;
    lbImg.src = src;
    lb.classList.add('on');
    lb.setAttribute('aria-hidden', 'false');
    dlBtn.classList.remove('done');
    document.body.classList.add('zoom');
  }

  function closeLb() {
    lb.classList.remove('on');
    lb.setAttribute('aria-hidden', 'true');
    lbImg.src = '';
    current = '';
    document.body.classList.remove('zoom');
  }

  function fileName(url) {
    const raw = decodeURIComponent(url.split('?')[0].split('#')[0].split('/').pop() || 'gif');
    const safe = raw.replace(/[^\w.\-]/g, '_').slice(-60) || 'gif';
    return /\.gif$/i.test(safe) ? safe : safe + '.gif';
  }

  async function download(url) {
    try {
      const r = await fetch(url, { mode: 'cors', referrerPolicy: 'no-referrer' });
      if (!r.ok) throw new Error('HTTP ' + r.status);

      const href = URL.createObjectURL(await r.blob());
      const a = document.createElement('a');
      a.href = href;
      a.download = fileName(url);
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(href), 5000);
      dlBtn.classList.add('done');
    } catch (e) {
      /* Host ohne CORS → neuer Tab, von dort speichern */
      log('download fallback:', e.message);
      window.open(url, '_blank', 'noopener');
    }
  }

  lb.addEventListener('click', closeLb);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLb(); });
  dlBtn.addEventListener('click', e => { e.stopPropagation(); if (current) download(current); });

  /* ------------------------------------------------------------------
     Scroll & Reset
  ------------------------------------------------------------------ */

  const nearBottom = () => scrollY + innerHeight > document.body.scrollHeight - innerHeight * 1.5;

  let tick = false;
  addEventListener('scroll', () => {
    if (tick) return;
    tick = true;
    requestAnimationFrame(() => {
      const max = document.body.scrollHeight - innerHeight;
      fill.style.height = (max > 0 ? Math.min(1, scrollY / max) * 100 : 0) + '%';
      if (nearBottom() && Date.now() - lastTry > 600) more();
      tick = false;
    });
  }, { passive: true });

  addEventListener('resize', () => { if (nearBottom()) more(); });

  new IntersectionObserver(e => { if (e.some(x => x.isIntersecting)) more(); },
    { rootMargin: '1500px 0px' }).observe(loader);

  document.getElementById('reset').addEventListener('click', e => {
    const b = e.currentTarget;
    b.classList.remove('spin'); void b.offsetWidth; b.classList.add('spin');

    closeLb();
    wall.querySelectorAll('.tile').forEach(t => t.remove());
    seen = new Set();
    SOURCES.forEach(s => { s.pool = []; s.dead = 0; s.deadAt = 0; });
    fill.style.height = '0%';
    scrollTo({ top: 0, behavior: 'auto' });
    more();
  });

  more();
})();
</script>
</body>
</html>
